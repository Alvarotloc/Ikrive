name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege for the GITHUB_TOKEN: every job only reads the repository (artifacts and the gha
# Docker cache use the runtime token, not these permissions). Jobs that need more declare their own block.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # The web build packaged in the APK: no service worker nor PWA manifest (fails otherwise).
      - run: pnpm --filter @ikrive/mobile build:web

  e2e:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ikrive/e2e exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Upload traces and screenshots
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-results
          path: |
            e2e/test-results/
            e2e/playwright-report/
          retention-days: 14

  docker:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build linux/amd64
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: ikrive:ci
          cache-from: type=gha,scope=ci-amd64
          cache-to: type=gha,mode=max,scope=ci-amd64
      - name: Build linux/arm64
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/arm64
          push: false
          load: true
          tags: ikrive:ci-arm64
          cache-from: type=gha,scope=ci-arm64
          cache-to: type=gha,mode=max,scope=ci-arm64
      - name: Image size (< 250 MB)
        run: |
          node docker/image-size.mjs ikrive:ci
          node docker/image-size.mjs ikrive:ci-arm64
      - name: No bundled packages in node_modules
        run: |
          docker run --rm --entrypoint sh ikrive:ci -c \
            'for p in better-auth fastify drizzle-orm drizzle-kit esbuild vitest; do test ! -e node_modules/$p || { echo "node_modules/$p must not be in the image"; exit 1; }; done'
      - name: Smoke test
        run: |
          docker run -d --name ikrive-smoke -p 3000:3000 \
            -e AUTH_SECRET=ci-smoke-secret-0123456789abcdefghijklmnop \
            -e BASE_URL=http://127.0.0.1:3000 \
            ikrive:ci
          node docker/smoke.mjs http://127.0.0.1:3000
          docker exec ikrive-smoke node dist/job.js reminders
          test "$(docker exec ikrive-smoke id -u)" = 1000
      - name: Native modules on linux/arm64
        run: |
          docker run --rm --platform linux/arm64 ikrive:ci-arm64 node -e "
            const Database = require('better-sqlite3');
            const db = new Database(':memory:');
            if (db.prepare('select 1 as one').get().one !== 1) process.exit(1);
            require('sharp')({ create: { width: 1, height: 1, channels: 3, background: '#000' } })
              .webp().toBuffer()
              .then((buffer) => { if (buffer.length === 0) process.exit(1); console.log('natives ok'); })
              .catch((error) => { console.error(error); process.exit(1); });
          "
      - name: Container logs
        if: failure()
        run: docker logs ikrive-smoke || true

  # Whether the Android project may have changed: the `android` job only runs then (paths filters only
  # exist for whole workflows, and `check`, `e2e` and `docker` must always run).
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      android: ${{ steps.filter.outputs.android }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            android:
              - 'apps/mobile/**'
              - 'apps/web/**'
              - 'packages/db/**'
              - 'pnpm-lock.yaml'
              - '.github/workflows/ci.yml'

  # Debug APK (signed with the debug key) to try the app on a phone: artifact `ikrive-debug-apk`.
  android:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.android == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ikrive/mobile build:web
      - run: pnpm --filter @ikrive/mobile exec cap sync android
      - name: Build the debug APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ikrive-debug-apk
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
