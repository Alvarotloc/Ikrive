# Keeps the SHA-pinned actions of .github/workflows/ up to date (and their `# vX.Y.Z` comments).
# Only GitHub Actions: npm and Docker dependencies are updated by hand.
# Minor and patch updates land together in one grouped PR; each major update gets its own PR
# (one per action and version) so its changelog can be reviewed on its own.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
