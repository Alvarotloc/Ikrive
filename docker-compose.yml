services:
  ikrive:
    image: ghcr.io/alvarotloc/ikrive:latest
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: ikrive
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file: .env
    volumes:
      - ./data:/data

  # Optional: self-hosted push notifications (configure an ntfy channel in Ikrive settings).
